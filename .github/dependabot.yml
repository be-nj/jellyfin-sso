version: 2

# Dependabot works without installing anything; the identity libraries in the auth path
# are the reason this exists, so they get their own group and a weekly check.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      identity:
        patterns:
          - 'Duende.IdentityModel*'
          - 'Microsoft.IdentityModel*'
          - 'System.IdentityModel*'
      test-tooling:
        patterns:
          - 'xunit*'
          - 'Microsoft.NET.Test.Sdk'
          - 'NSubstitute'
          - 'Testcontainers*'
          - 'Microsoft.Playwright'
          - 'coverlet*'
    ignore:
      # Pinned to the server's ABI on purpose; bumping these is a deliberate port.
      - dependency-name: Jellyfin.Controller
      - dependency-name: Jellyfin.Model

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # github/codeql-action/init, /analyze and /upload-sarif are one repository, and
      # the action refuses to run with its steps on different versions: "Loaded a
      # configuration file for version '4.39.0', but running version '4.39.1'". Bumped
      # one pull request each, every one of them fails on its own and none can merge.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
