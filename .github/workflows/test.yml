name: Tests

# No path filter on purpose: main requires `test` and the three `e2e` checks, and a check
# that never runs never reports, so a documentation-only pull request would wait for ever.
# The jobs run on everything and decide for themselves — `code` below is false when a
# change touches nothing but Markdown, so the heavy steps are skipped and the required
# check still reports in a few seconds.
# workflow_dispatch exists for one reason: a pull request opened by the release workflow
# runs with GITHUB_TOKEN, and GitHub does not start workflows for those — the required
# checks would never report and auto-merge would wait for ever. The release dispatches
# this run against its own branch instead.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Does this change touch anything a test could fail on? A push to main compares against
  # the commit before it; a pull request against its merge base. Anything that is not
  # Markdown counts, including the workflow itself.
  changes:
    runs-on: ubuntu-latest
    # A crashed filter leaves the output empty, which the jobs below read as "run".
    continue-on-error: true
    outputs:
      # Anything but a deliberate 'false' means the tests run: a filter that fell over
      # must not be able to wave a change through.
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The filter decides whether the four required checks run anything at all, so it
      # must not come from the branch being checked: a pull request that rewrote this
      # script to print code=false made test and all three e2e jobs report success with
      # no steps executed, and those four are the only gate on main. The base commit's
      # copy decides instead — a change to the filter is reviewed before it can skip the
      # suite that would have run on it.
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          filter="$RUNNER_TEMP/changed-code.sh"
          if git cat-file -e "$BASE:scripts/changed-code.sh" 2>/dev/null; then
            git show "$BASE:scripts/changed-code.sh" > "$filter"
          else
            # No base copy — a new branch, a force push, the first commit. The filter's own
            # rule for an unreadable change applies: treat it as code and run everything.
            echo 'echo "code=true"' > "$filter"
          fi
          bash "$filter" "$BASE" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code != 'false'

      - name: Set up .NET
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # The SDK comes from global.json, so CI and a local rebuild produce the same
          # bytes for a release.
          global-json-file: global.json

      - name: Run the test suite
        if: needs.changes.outputs.code != 'false'
        run: dotnet test tests/Jellyfin.Plugin.Sso.Tests -c Release --logger trx

      # The README states four counts, and they drift the moment somebody adds a test
      # and does not think about the README. Cheap here, because the projects are built.
      - name: Check the counts the README states
        if: needs.changes.outputs.code != 'false'
        run: scripts/check-readme-counts.sh

      - name: Upload test results
        if: always() && needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: tests/runs/dotnet/results/
          if-no-files-found: ignore

  # The review document claims that every finding ended in a commit or an issue. That
  # claim rots the moment one of them is rewritten or deleted, so it is checked.
  # Not gated on `changes`: it checks a claim the review documents make, which is exactly
  # what a documentation-only change can break, and it takes a dozen seconds.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the review's references
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-review-audit.sh

      # The manifest is what Jellyfin servers poll, and nothing else here looked at it.
      # Not gated on `changes` for the same reason as the line above: a documentation-only
      # change can edit a URL just as well as a code change can.
      - name: Check the manifest against its own assets
        run: scripts/check-manifest.sh

  # Which servers the pull requests run against. The list is jellyfin-versions.json, so
  # adding or dropping one is a one-line review instead of a matrix buried in this file,
  # and so the weekly bump can propose it as an ordinary pull request.
  #
  # Floor plus the newest two. The floor catches the plugin reaching for an API the oldest
  # server it claims does not have; the newest catch jellyfin-web moving the login page
  # under it, and both real breakages so far were that second kind. The versions in
  # between are not dropped, they are moved: Upstream runs every 12.x there is, once a
  # week, where a failure opens an issue instead of blocking somebody's merge.
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Not gated on `changes`: the file is not Markdown, so editing it is a code change
      # either way, and two seconds here beats three containers spending twenty minutes
      # to discover the same typo.
      - name: Check the list against the ABI the plugin is built for
        run: scripts/check-jellyfin-versions.sh

      - id: read
        run: echo "list=$(jq -c '.' jellyfin-versions.json)" >> "$GITHUB_OUTPUT"

  # The plugin is built against the oldest server it claims to support, and the same
  # build is run against every server in jellyfin-versions.json. The claim in the README
  # is this job's result, not an assumption about ABI stability.
  e2e:
    needs: [changes, versions]
    # always() for `changes`, which is continue-on-error: a crashed filter must still
    # leave the suite running. Not for `versions` — without its list there is no matrix
    # at all, and e2e-all below turns that into a failure instead of a silent pass.
    if: always() && needs.versions.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ${{ fromJSON(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code != 'false'

      - name: Set up .NET
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # The SDK comes from global.json, so CI and a local rebuild produce the same
          # bytes for a release.
          global-json-file: global.json

      # Drives a throwaway Jellyfin container with the real plugin ZIP, a fake identity
      # provider and a headless browser.
      - name: Run the e2e suite against Jellyfin ${{ matrix.jellyfin }}
        if: needs.changes.outputs.code != 'false'
        env:
          E2E_JELLYFIN_TAG: ${{ matrix.jellyfin }}
        run: >
          dotnet test tests/Jellyfin.Plugin.Sso.E2eTests -c Release --logger trx
          --filter "Category!=RealIdp&Category!=Screenshots&Category!=Demo&Category!=Manual"

      - name: Upload e2e artifacts
        if: always() && needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-results-${{ matrix.jellyfin }}
          path: |
            tests/runs/dotnet/results/
            tests/runs/playwright/*.png
            tests/runs/playwright/*.html
            tests/runs/playwright/*.trace.zip
          if-no-files-found: ignore

  # One check with a stable name standing in for the whole matrix.
  #
  # main's ruleset used to require `e2e (12.0)`, `e2e (12.1)` and `e2e (12.2)` by name,
  # which made the set of servers one decision kept in two places. The day 12.3 and 12.4
  # shipped, moving the matrix would have left main waiting for a check that no longer
  # runs, and undoing that is a repository setting — which is exactly what the release's
  # own GITHUB_TOKEN pull request may not touch. So main requires this job instead. It
  # passes only when every matrix job passed, which puts the list of servers back in a
  # file that review can change.
  e2e-all:
    needs: [versions, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every server in the matrix passed
        env:
          VERSIONS: ${{ needs.versions.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "versions: $VERSIONS"
          echo "e2e:      $E2E"
          # A matrix that was skipped is a hole, not a pass: nothing ran, so the servers
          # this release claims were not tested on this change at all.
          if [ "$VERSIONS" != success ] || [ "$E2E" != success ]; then
            echo "::error::the server matrix did not pass"
            exit 1
          fi

  # Real identity providers in containers: slower, and separate so a Keycloak or Authelia
  # release breaking its own container image does not look like a plugin regression.
  real-idp:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code != 'false'

      - name: Set up .NET
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # The SDK comes from global.json, so CI and a local rebuild produce the same
          # bytes for a release.
          global-json-file: global.json

      - name: Run the suite against Authentik, Keycloak and Authelia
        if: needs.changes.outputs.code != 'false'
        run: >
          dotnet test tests/Jellyfin.Plugin.Sso.E2eTests -c Release --logger trx
          --filter "Category=RealIdp"

      - name: Upload artifacts
        if: always() && needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: real-idp-results
          path: |
            tests/runs/dotnet/results/
            tests/runs/playwright/*.png
            tests/runs/playwright/*.html
            tests/runs/playwright/*.trace.zip
          if-no-files-found: ignore
