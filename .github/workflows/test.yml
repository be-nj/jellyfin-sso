name: Tests

# No path filter on purpose: main requires `test` and the three `e2e` checks, and a check
# that never runs never reports, so a documentation-only pull request would wait for ever.
# The jobs run on everything and decide for themselves — `code` below is false when a
# change touches nothing but Markdown, so the heavy steps are skipped and the required
# check still reports in a few seconds.
# workflow_dispatch exists for one reason: a pull request opened by the release workflow
# runs with GITHUB_TOKEN, and GitHub does not start workflows for those — the required
# checks would never report and auto-merge would wait for ever. The release dispatches
# this run against its own branch instead.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Does this change touch anything a test could fail on? A push to main compares against
  # the commit before it; a pull request against its merge base. Anything that is not
  # Markdown counts, including the workflow itself.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: scripts/changed-code.sh "$BASE" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # The SDK comes from global.json, so CI and a local rebuild produce the same
          # bytes for a release.
          global-json-file: global.json

      - name: Run the test suite
        if: needs.changes.outputs.code == 'true'
        run: dotnet test tests/Jellyfin.Plugin.Sso.Tests -c Release --logger trx

      - name: Upload test results
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: tests/runs/dotnet/results/
          if-no-files-found: ignore

  # The review document claims that every finding ended in a commit or an issue. That
  # claim rots the moment one of them is rewritten or deleted, so it is checked.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the review's references
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-review-audit.sh

  # The plugin is built against the oldest server it claims to support, and the same
  # build is run against every server in that range. The claim in the README is this
  # job's result, not an assumption about ABI stability.
  e2e:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ['12.0', '12.1', '12.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # The SDK comes from global.json, so CI and a local rebuild produce the same
          # bytes for a release.
          global-json-file: global.json

      # Drives a throwaway Jellyfin container with the real plugin ZIP, a fake identity
      # provider and a headless browser.
      - name: Run the e2e suite against Jellyfin ${{ matrix.jellyfin }}
        if: needs.changes.outputs.code == 'true'
        env:
          E2E_JELLYFIN_TAG: ${{ matrix.jellyfin }}
        run: >
          dotnet test tests/Jellyfin.Plugin.Sso.E2eTests -c Release --logger trx
          --filter "Category!=RealIdp&Category!=Screenshots&Category!=Demo"

      - name: Upload e2e artifacts
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-results-${{ matrix.jellyfin }}
          path: |
            tests/runs/dotnet/results/
            tests/runs/playwright/*.png
            tests/runs/playwright/*.html
          if-no-files-found: ignore

  # Real identity providers in containers: slower, and separate so a Keycloak or Authelia
  # release breaking its own container image does not look like a plugin regression.
  real-idp:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # The SDK comes from global.json, so CI and a local rebuild produce the same
          # bytes for a release.
          global-json-file: global.json

      - name: Run the suite against Authentik, Keycloak and Authelia
        if: needs.changes.outputs.code == 'true'
        run: >
          dotnet test tests/Jellyfin.Plugin.Sso.E2eTests -c Release --logger trx
          --filter "Category=RealIdp"

      - name: Upload artifacts
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: real-idp-results
          path: |
            tests/runs/dotnet/results/
            tests/runs/playwright/*.png
            tests/runs/playwright/*.html
          if-no-files-found: ignore
