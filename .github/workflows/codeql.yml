name: CodeQL

# Static analysis of the auth path. Runs on changes and weekly, so a new rule set still
# reaches a repository that has been quiet for a while.
on:
  push:
    branches: [main]
    paths-ignore: &prose
      - '**/*.md'
      - 'docs/**'
      - 'CNAME'
      - 'LICENSE'
  pull_request:
    paths-ignore: *prose
  schedule:
    - cron: '0 5 * * 1'

# Least privilege at the top; the job that needs to write findings asks for it itself.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # The SDK comes from global.json, so CI and a local rebuild produce the same
          # bytes for a release.
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: csharp
          queries: security-and-quality

      - name: Build the plugin
        run: dotnet build Jellyfin.Plugin.Sso -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
