name: CodeQL

# Static analysis of the auth path. Runs on changes and weekly, so a new rule set still
# reaches a repository that has been quiet for a while.
on:
  push:
    branches: [main]
    paths-ignore: &prose
      - '**/*.md'
      - 'docs/**'
      - 'CNAME'
      - 'LICENSE'
      - 'manifest.json'
      - 'm.json'
  pull_request:
    paths-ignore: *prose
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build the plugin
        run: dotnet build Jellyfin.Plugin.Sso -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v4
