name: Upstream

# The same tests the pull requests run, against the newest Jellyfin and the newest
# Authentik, Keycloak and Authelia, once a week.
#
# Every other run in this repository pins its containers, and should: a provider that
# ships a breaking release on a Tuesday must not turn that week's pull requests into a
# mystery. The cost of pinning is that the suite only ever proves the plugin worked with
# the versions it was written against, and the first person to discover that Keycloak
# changed something underneath it would otherwise be whoever upgraded their Keycloak.
#
# So the pin is lifted here, on a schedule, where a failure is this plugin's problem to
# look at before a user hits it — and where it cannot block anybody's merge, because
# nothing in this file is a required check.
on:
  schedule:
    # Monday, after the mutation run at 04:00 and before the scorecard at 06:00.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every server the plugin claims, which is every minor of the major its targetAbi names.
  # The pull requests test the floor and the newest two and say so; this is where the rest
  # of the claim gets proven, weekly, without standing in anybody's way.
  #
  # Plus :latest, which is the tag a brand-new installation pulls — and the only entry
  # here that can turn up a major nobody has thought about yet.
  servers:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.minors.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: minors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minors=$(scripts/jellyfin-minors.sh)
          echo "released: $minors"
          list=$(printf '%s\nlatest\n' "$minors" | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "testing: $list"

  jellyfin:
    name: Jellyfin ${{ matrix.jellyfin }}
    needs: servers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ${{ fromJSON(needs.servers.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Check the image exists before testing against it
        run: scripts/upstream-check-images.sh "jellyfin/jellyfin:${{ matrix.jellyfin }}"

      - name: Run the e2e suite against Jellyfin ${{ matrix.jellyfin }}
        env:
          E2E_JELLYFIN_TAG: ${{ matrix.jellyfin }}
        run: >
          dotnet test tests/Jellyfin.Plugin.Sso.E2eTests -c Release --logger trx
          --filter "Category!=RealIdp&Category!=Screenshots&Category!=Demo&Category!=Manual"

      - name: Record what ran
        if: always()
        run: scripts/upstream-images.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upstream-jellyfin-${{ matrix.jellyfin }}
          path: |
            tests/runs/dotnet/results/
            tests/runs/playwright/*.png
            tests/runs/playwright/*.html
          if-no-files-found: ignore

  # Move the pin the pull requests test against, when Jellyfin has published something
  # newer — as a pull request, never as a push.
  #
  # Only after the matrix above went green, so the version being proposed is one that has
  # just been tested rather than one that merely exists. A release that breaks the plugin
  # opens an issue through `report` below and does not quietly become a required check.
  bump:
    name: Move the tested pin
    needs: [servers, jellyfin]
    if: needs.jellyfin.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/bump-jellyfin-versions.sh

      - name: Open a pull request with the new list
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.bump.outputs.before }}
          AFTER: ${{ steps.bump.outputs.after }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch=jellyfin-versions/$(jq -r '.[-1]' jellyfin-versions.json)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add jellyfin-versions.json
          git commit -m "Test the pull requests against $AFTER"
          git push --force origin "$branch"

          # printf rather than a heredoc: every line of a run: block has to stay
          # indented for the YAML, and a heredoc would carry that indentation into the
          # pull request body.
          body=$(printf '%s\n' \
            "Jellyfin has released a newer server than the pull requests test against." \
            "" \
            "Was \`$BEFORE\`, now \`$AFTER\`. The weekly run passed the whole matrix," \
            "including the version being added, before this was opened: $RUN_URL" \
            "" \
            "Not merged automatically, because this changes what every later pull request" \
            "is held to.")

          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "Test the pull requests against $AFTER" \
              --body "$body"
          fi

          # A pull request opened with GITHUB_TOKEN starts no workflows, so the checks it
          # should be judged on are dispatched against the branch by hand — the same rule
          # the release workflow works around for the manifest.
          gh workflow run test.yml --ref "$branch"

  # The three providers at their current release. Authentik is configured through its API
  # and Keycloak through a realm import, so this also catches a provider changing the
  # shape of its own configuration, not only the login flow.
  providers:
    name: Newest providers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # Keycloak and Authelia keep :latest current, so "newest" is just that tag.
      # authentik publishes no usable moving tag — no :latest at all, and a :stable last
      # built in February 2022 — so its newest release is looked up by name.
      - name: Work out which authentik is newest
        id: authentik
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/upstream-authentik-image.sh >> "$GITHUB_OUTPUT"

      # Through the environment and quoted. ${{ }} is substituted into the script before
      # a shell sees it, and this value is a tag name read from somebody else's releases —
      # git refnames allow ; | $ ` ( ), so an unquoted splice here was a command injection
      # from whoever can publish a release in that repository, fired weekly and unattended.
      - name: Check the images exist before testing against them
        env:
          AUTHENTIK_IMAGE: ${{ steps.authentik.outputs.image }}
        run: >
          scripts/upstream-check-images.sh
          "$AUTHENTIK_IMAGE"
          quay.io/keycloak/keycloak:latest
          ghcr.io/authelia/authelia:latest

      - name: Run the suite against the latest Authentik, Keycloak and Authelia
        env:
          E2E_AUTHENTIK_IMAGE: ${{ steps.authentik.outputs.image }}
          E2E_KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:latest
          E2E_AUTHELIA_IMAGE: ghcr.io/authelia/authelia:latest
        run: >
          dotnet test tests/Jellyfin.Plugin.Sso.E2eTests -c Release --logger trx
          --filter "Category=RealIdp"

      - name: Record what ran
        if: always()
        run: scripts/upstream-images.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upstream-providers
          path: |
            tests/runs/dotnet/results/
            tests/runs/playwright/*.png
            tests/runs/playwright/*.html
          if-no-files-found: ignore

  # A scheduled run nobody watches is a run nobody has. A failure opens an issue, or adds
  # a comment to the one that is already open, so the break is in the same place as every
  # other finding in this repository. It is deliberately not closed automatically: the
  # issue is closed by whoever worked out what changed, with the cause written down.
  report:
    name: Say so
    needs: [servers, jellyfin, providers]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Open or update the upstream issue
        env:
          GH_TOKEN: ${{ github.token }}
          JELLYFIN_RESULT: ${{ needs.jellyfin.result }}
          PROVIDERS_RESULT: ${{ needs.providers.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/upstream-report.sh
