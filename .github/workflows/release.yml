name: Release

# Tag a commit on main to publish a release:
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The workflow builds the plugin ZIP, attaches it to a GitHub release and adds
# the version to manifest.json on main, which is the file Jellyfin polls.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    # Pinned, not latest. package.sh promises that anybody can rebuild a release and
    # compare the checksum, and it pins the commit date, the path map and the SDK — but
    # not the zip and zlib that actually emit the bytes. A runner image moving to a
    # different deflate would break reproducibility silently, and a failed reproduction
    # cannot be told apart from tampering.
    runs-on: ubuntu-24.04
    permissions:
      # Creates the release and the manifest pull request.
      contents: write
      pull-requests: write
      # Provenance: the attestation is signed for this repository and run.
      id-token: write
      attestations: write
      # Dispatches the test workflow against the manifest branch; without it the
      # dispatch answers "Resource not accessible by integration" and the release
      # job fails after the release itself is already published.
      actions: write
    steps:
      # The tag's own commit, not main's tip. Checking out main meant the published ZIP
      # held whatever main had moved on to, while the provenance attestation below binds
      # its statement to the run's github.sha — the tag commit — so a verifier would have
      # seen a valid attestation asserting a revision the bytes did not come from. The
      # archive timestamps come from the checked-out commit too, so even a rebuild from
      # the tag could not reproduce the checksum.
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify the tag points at main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # The SDK comes from global.json, so CI and a local rebuild produce the same
          # bytes for a release.
          global-json-file: global.json

      # The tag name reaches the shell through the environment, never through ${{ }}.
      # The check below counts dots and nothing else, and package.sh validates the shape
      # properly — but that runs after the template has already expanded, so a tag like
      # v1.$(…).0 would have executed in a job that can write releases and sign
      # attestations. Only the owner can push a tag here today; the fix costs nothing.
      - name: Derive the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          raw="${TAG#v}"
          # Jellyfin wants a four-part version; v1.1.0 becomes 1.1.0.0.
          case "$(tr -cd '.' <<< "$raw" | wc -c)" in
            2) version="$raw.0" ;;
            3) version="$raw" ;;
            *) echo "tag must look like v1.1.0 or v1.1.0.0, got $TAG"; exit 1 ;;
          esac
          # The shape, not just the number of dots. Everything downstream carries this
          # value, and a tag is a string somebody chose: without this, v1.';id;'.0 passed
          # the count above and reached a shell.
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be digits and dots, got $TAG"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=jellyfin-sso_$version.zip" >> "$GITHUB_OUTPUT"

      - name: Run the test suite
        run: dotnet test tests/Jellyfin.Plugin.Sso.Tests -c Release

      # The container-backed providers run on every push; a release must not hinge on
      # three upstream images being healthy at that minute. The demo recordings are
      # documentation artifacts and start the same heavy providers, so they stay out too.
      - name: Run the e2e suite
        run: >
          dotnet test tests/Jellyfin.Plugin.Sso.E2eTests -c Release
          --filter "Category!=RealIdp&Category!=Screenshots&Category!=Demo&Category!=Manual"

      - name: Build the plugin package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package.sh "$VERSION"

      - name: Attest what was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.version.outputs.zip }}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          zip="dist/$ZIP"
          # Idempotent: a rerun after a later step failed must not stop here.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" \
              --title "$VERSION" \
              --generate-notes
          fi

      - name: Add the version to manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The notes the step above generated, not a sentence about them. Jellyfin shows
          # this field under the version in the catalog and renders it as Markdown, so the
          # release body is exactly what a server operator deciding whether to update
          # needs. Five releases shipped with "See the release notes for v1.12.20." in
          # that spot, which named no link and pointed nowhere, while the real notes sat
          # on the release this job had just created.
          notes=$(gh release view "$GITHUB_REF_NAME" --json body --jq '.body')

          if [ -z "${notes//[[:space:]]/}" ]; then
            notes="See the release notes: $SERVER_URL/$REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          fi

          scripts/update-manifest.sh \
            "$VERSION" \
            "$(cat "dist/$ZIP.md5")" \
            "$SERVER_URL/$REPOSITORY/releases/download/$GITHUB_REF_NAME/$ZIP" \
            "$notes"

      # The manifest goes to main the same way every other change does: through a pull
      # request that has to pass the test matrix. Nothing bypasses the rules on main,
      # and the release is still hands-off — auto-merge lands it once CI is green.
      - name: Open a pull request with the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          branch="manifest/$GITHUB_REF_NAME"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add manifest.json m.json
          git commit -m "Publish $version in the plugin manifest"
          git push --force origin "$branch"

          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "Publish $version in the plugin manifest" \
              --body "Built from $GITHUB_REF_NAME. The catalog offers this version once this lands."
          fi

          gh pr merge "$branch" --auto --squash --delete-branch

          # A pull request opened with GITHUB_TOKEN starts no workflows, so the checks
          # main requires are dispatched against the branch by hand.
          gh workflow run test.yml --ref "$branch"

          # GitHub also queues the pull request's own runs in "action_required": the
          # author is a bot, and a bot counts as a first-time contributor forever. Those
          # held runs are required checks, so auto-merge waits behind them however green
          # the dispatched run is. v1.12.9 and v1.12.10 both had to be released by hand
          # for that reason. Approving them is what a person would click; `|| true`
          # because a token may not be allowed to approve its own runs, and a release
          # that is otherwise finished should not fail on it.
          # GitHub takes a moment to create those held runs, so this waits for them
          # instead of looking once: v1.12.11 found nothing and waited for a hand.
          for attempt in $(seq 1 18); do
            held=$(gh run list --branch "$branch" --limit 20 \
              --json databaseId,conclusion \
              --jq '.[] | select(.conclusion == "action_required") | .databaseId')

            if [ -n "$held" ]; then
              for id in $held; do
                echo "approving run $id"
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" || true
              done
              break
            fi

            echo "no held runs yet (attempt $attempt)"
            sleep 10
          done

      # Nothing has tested the commit that ends up on main. The checks ran against the
      # manifest branch, and the squash that lands them is pushed with GITHUB_TOKEN,
      # which starts no workflows — the same rule that makes the dispatch above
      # necessary. Four of the last five manifest commits on main therefore carry no
      # Tests run at all, so "is main green?" answers about the commit before them.
      #
      # Dispatching against main once the merge has landed gives main's own head a
      # verdict. It is not the branch's run relabelled: it tests the squashed tree,
      # which is the one servers will poll.
      #
      # Bounded and never fatal, like the approval above it. If the manifest pull
      # request has not landed within ten minutes its own checks have failed and a
      # person is looking at it already; the release itself is finished either way, and
      # failing it here would say something untrue about the artifact.
      - name: Test main with the manifest on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="manifest/$GITHUB_REF_NAME"

          for attempt in $(seq 1 30); do
            state=$(gh pr view "$branch" --json state --jq .state 2>/dev/null || echo UNKNOWN)

            if [ "$state" = MERGED ]; then
              echo "manifest pull request merged; dispatching the suite against main"
              gh workflow run test.yml --ref main || true
              exit 0
            fi

            if [ "$state" = CLOSED ]; then
              echo "manifest pull request was closed without merging; nothing to test"
              exit 0
            fi

            echo "manifest pull request is $state (attempt $attempt)"
            sleep 20
          done

          echo "manifest pull request had not landed after ten minutes; main stays untested"
