name: Release

# Tag a commit on main to publish a release:
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The workflow builds the plugin ZIP, attaches it to a GitHub release and adds
# the version to manifest.json on main, which is the file Jellyfin polls.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Pushes the manifest commit and creates the release.
      contents: write
      # Provenance: the attestation is signed for this repository and run.
      id-token: write
      attestations: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the tag points at main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" main \
            || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # The SDK comes from global.json, so CI and a local rebuild produce the same
          # bytes for a release.
          global-json-file: global.json

      - name: Derive the version from the tag
        id: version
        run: |
          raw="${GITHUB_REF_NAME#v}"
          # Jellyfin wants a four-part version; v1.1.0 becomes 1.1.0.0.
          case "$(tr -cd '.' <<< "$raw" | wc -c)" in
            2) version="$raw.0" ;;
            3) version="$raw" ;;
            *) echo "tag must look like v1.1.0 or v1.1.0.0, got $GITHUB_REF_NAME"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=jellyfin-sso_$version.zip" >> "$GITHUB_OUTPUT"

      - name: Run the test suite
        run: dotnet test tests/Jellyfin.Plugin.Sso.Tests -c Release

      # The container-backed providers run on every push; a release must not hinge on
      # three upstream images being healthy at that minute.
      - name: Run the e2e suite
        run: >
          dotnet test tests/Jellyfin.Plugin.Sso.E2eTests -c Release
          --filter "Category!=RealIdp&Category!=Screenshots"

      - name: Build the plugin package
        run: scripts/package.sh "${{ steps.version.outputs.version }}"

      - name: Attest what was built
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/${{ steps.version.outputs.zip }}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/${{ steps.version.outputs.zip }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Add the version to manifest.json
        run: |
          version='${{ steps.version.outputs.version }}'
          zip='${{ steps.version.outputs.zip }}'
          scripts/update-manifest.sh \
            "$version" \
            "$(cat "dist/$zip.md5")" \
            "${{ github.server_url }}/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$zip" \
            "See the release notes for $GITHUB_REF_NAME."

      - name: Commit the manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add manifest.json m.json
          git commit -m "Publish ${{ steps.version.outputs.version }} in the plugin manifest"
          git push origin main
